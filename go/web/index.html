<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ship feed · Go</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <h1>Ship feed</h1>
          <p class="badge" id="connection" data-state="connecting">
            <span class="dot" aria-hidden="true"></span>
            <span id="connection-label">Connecting…</span>
          </p>
        </div>
        <form id="deploy-form" class="add">
          <input id="app" placeholder="app name (e.g. web)" maxlength="40" required />
          <button type="submit">Trigger deploy</button>
        </form>
      </header>
      <section id="feed" class="feed" aria-live="polite"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
